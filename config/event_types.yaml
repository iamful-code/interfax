# Классификация типов сообщений e-disclosure.ru по регулярным выражениям (без учёта регистра).
# Сопоставление идёт по заголовку/типу сообщения, как он показан в результатах поиска и на странице события.
# Порядок важен: берётся первая подошедшая категория. Категория "other" -- всё остальное.
#
# direction_rule -- как определять направление сигнала:
#   stake_change  : по изменению доли (увеличение = +1, уменьшение = -1), см. edisclosure/insider.py
#   positive      : всегда +1 (ожидаемо позитивная новость)
#   negative      : всегда -1
#   neutral       : 0 (направление неизвестно без чтения текста)
categories:
  - name: insider_stake_change
    title_ru: Изменение доли участия членов органов управления (сделки инсайдеров)
    direction_rule: stake_change
    patterns:
      - "изменени\\S* размера доли участия .*орган\\S* управлени"
      - "изменени\\S* размера доли участия член\\S* органа управления"
      - "изменени\\S* доли участия лиц, входящих в состав органов управления"
      - "изменени\\S* размера доли участия .*лиц\\S*, входящ"
  - name: insider_transactions
    title_ru: Сведения об операциях/сделках инсайдеров (224-ФЗ)
    direction_rule: neutral
    patterns:
      - "инсайдер"
  - name: buyback
    title_ru: Приобретение эмитентом собственных акций (buyback)
    direction_rule: positive
    patterns:
      - "приобретени\\S* эмитентом (собственных )?(акций|ценных бумаг)"
      - "выкуп\\S* .*акци"
      - "об увеличении доли эмитента"
  - name: dividends_recommendation
    title_ru: Рекомендация по дивидендам (совет директоров)
    direction_rule: neutral
    patterns:
      - "рекомендац\\S* .*дивиденд"
      - "дивиденд\\S* .*рекомендац"
  - name: dividends_decision
    title_ru: Решение о выплате / начисленные доходы по ценным бумагам
    direction_rule: neutral
    patterns:
      - "начисленных .*доходах"
      - "выплат\\S* .*дивиденд"
      - "объявленных .*дивиденд"
      - "о выплаченных доходах"
      - "дивиденд"
  - name: major_holder_change
    title_ru: Изменение доли крупных акционеров (порог 5/10/15/20/25/30/50/75/95%)
    direction_rule: neutral
    patterns:
      - "приобретени\\S* лицом (голосующих )?акци"
      - "изменени\\S* доли .*(лиц|акционер).*(голос|распоряжа)"
      - "лиц\\S*, (имеющ|получивш)\\S* право распоряжаться .*голос"
      - "изменени\\S* размера доли .*акционер"
      - "об изменении доли участия .*акционера"
  - name: controlling_person
    title_ru: Появление/прекращение контролирующего лица
    direction_rule: neutral
    patterns:
      - "контролирующ\\S* лиц"
      - "подконтрольн\\S* .*(появлен|прекращен)"
  - name: board_agenda
    title_ru: Заседание совета директоров и повестка
    direction_rule: neutral
    patterns:
      - "заседани\\S* совета директоров .*повестк"
      - "о проведении заседания совета директоров"
      - "созыв\\S* заседани\\S* совета директоров"
  - name: board_decisions
    title_ru: Решения совета директоров
    direction_rule: neutral
    patterns:
      - "решени\\S*, принят\\S* советом директоров"
      - "отдельных решениях"
      - "решени\\S* совета директоров"
  - name: agm_call
    title_ru: Созыв общего собрания акционеров
    direction_rule: neutral
    patterns:
      - "созыв\\S* .*общего собрания"
      - "о созыве"
      - "дат\\S* .*общего собрания"
  - name: agm_results
    title_ru: Итоги общего собрания акционеров
    direction_rule: neutral
    patterns:
      - "проведении общего собрания .*принятых им решени"
      - "решени\\S* общ\\S* собрани"
      - "итог\\S* .*общего собрания"
  - name: material_transaction
    title_ru: Существенная / крупная сделка
    direction_rule: neutral
    patterns:
      - "существенн\\S* сделк"
      - "крупн\\S* сделк"
  - name: related_party_transaction
    title_ru: Сделка с заинтересованностью
    direction_rule: neutral
    patterns:
      - "заинтересованност"
  - name: financial_statements
    title_ru: Публикация отчётности (РСБУ/МСФО/отчёт эмитента)
    direction_rule: neutral
    patterns:
      - "консолидированн\\S* финансов\\S* отчетност"
      - "бухгалтерск\\S* .*отчетност"
      - "отчет\\S* эмитента"
      - "годов\\S* отчет"
      - "ежеквартальн\\S* отчет"
      - "промежуточн\\S* .*отчетност"
      - "финансов\\S* отчетност"
  - name: rating
    title_ru: Присвоение / изменение кредитного рейтинга
    direction_rule: neutral
    patterns:
      - "рейтинг"
  - name: listing
    title_ru: Листинг / делистинг / изменение уровня списка
    direction_rule: neutral
    patterns:
      - "делистинг"
      - "включени\\S* .*в (список|котировальн)"
      - "исключени\\S* .*из (списка|котировальн)"
      - "изменени\\S* .*уровн\\S* .*списк"
      - "листинг"
  - name: default_or_debt
    title_ru: Неисполнение обязательств / дефолт / просрочка
    direction_rule: negative
    patterns:
      - "неисполнени\\S* .*обязательств"
      - "дефолт"
      - "просрочк"
      - "техническ\\S* дефолт"
  - name: bonds
    title_ru: "Облигации: выпуск, купоны, погашение, оферта"
    direction_rule: neutral
    patterns:
      - "облигаци"
      - "купон"
      - "оферт"
      - "погашени\\S* .*ценных бумаг"
      - "биржевых облигац"
  - name: share_issue
    title_ru: Эмиссия акций (доп. выпуск, размещение, SPO)
    direction_rule: neutral
    patterns:
      - "дополнительн\\S* выпуск"
      - "размещени\\S* .*(акци|ценных бумаг)"
      - "этап\\S* .*эмисси"
      - "государственн\\S* регистраци\\S* .*выпуск"
      - "решени\\S* о выпуске"
  - name: reorganization_ma
    title_ru: Реорганизация, слияния/поглощения, приобретение долей
    direction_rule: neutral
    patterns:
      - "реорганизац"
      - "присоединени"
      - "слияни"
      - "приобретени\\S* .*(доли|акций) .*(организац|обществ)"
      - "получени\\S* .*права распоряжаться .*подконтрольн"
  - name: management_change
    title_ru: Изменения в органах управления (смена CEO, СД)
    direction_rule: neutral
    patterns:
      - "состав\\S* .*органов управления"
      - "единоличн\\S* исполнительн\\S* орган"
      - "избрани\\S* .*(генерального директора|президента|председателя)"
      - "прекращени\\S* полномочий"
  - name: significant_other
    title_ru: Иные события, существенно влияющие на стоимость ценных бумаг (по мнению эмитента)
    direction_rule: neutral
    patterns:
      - "иных событиях"
      - "существенн\\S* влияни\\S* на стоимость"
      - "могут оказать существенное влияние"
      - "оказывающ\\S*, по мнению эмитента"
  - name: correction
    title_ru: Изменение/корректировка ранее опубликованной информации (шум)
    direction_rule: neutral
    patterns:
      - "корректировк"
      - "изменении или корректировке"
      - "ранее опубликованн"
  - name: affiliated_list
    title_ru: Списки аффилированных лиц
    direction_rule: neutral
    patterns:
      - "аффилированн"
  - name: other
    title_ru: Прочее
    direction_rule: neutral
    patterns: []
